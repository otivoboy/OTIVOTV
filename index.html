<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTIVO Chart View</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="description" content="High-performance real-time trading platform with AI-driven analytics, live tick data streaming, and advanced charting." />
    <meta property="og:title" content="OTIVO Chart View" />
    <meta property="og:description" content="High-performance real-time trading platform with AI-driven analytics, live tick data streaming, and advanced charting." />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:image" content="/logo.png" />
    <style>
      #otivo-preloader-root {
        position: fixed;
        inset: 0;
        z-index: 999999;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #030712;
        background-image: 
            radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.08) 0, transparent 50%),
            radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.05) 0, transparent 50%),
            linear-gradient(rgba(255, 255, 255, 0.007) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.007) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #otivo-preloader-root.otivo-preloader-exit {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }

      .otivo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }

      .otivo-svg-hidden {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }

      .otivo-inline-block {
        display: inline-block;
        filter: drop-shadow(0 0 8px var(--glow-color, rgba(16, 185, 129, 0.4)));
        transition: filter 0.3s ease;
      }

      .otivo-loader {
        display: flex;
        margin: 0.25em 0;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      @media (max-width: 460px) {
        .otivo-loader {
          gap: 8px;
          transform: scale(0.85);
        }
      }

      @media (max-width: 360px) {
        .otivo-loader {
          gap: 5px;
          transform: scale(0.72);
        }
      }

      /* SVG Line Dash & Offset Choreography */
      .otivo-dash {
        animation: otivoDashArray 2.5s ease-in-out infinite,
                   otivoDashOffset 2.5s linear infinite;
      }

      .otivo-spin {
        animation: otivoSpinDashArray 2s ease-in-out infinite,
                   otivoSpin 6s cubic-bezier(0.4, 0, 0.2, 1) infinite,
                   otivoDashOffset 2s linear infinite;
        transform-origin: center;
      }

      /* Custom Forex Bullish / Bearish animations */
      .otivo-pulse-slow {
        animation: otivoSubtlePulse 3s ease-in-out infinite;
      }

      @keyframes otivoSubtlePulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }

      @keyframes otivoDashArray {
        0% {
          stroke-dasharray: 0 1 359 0;
        }
        50% {
          stroke-dasharray: 0 180 180 0;
        }
        100% {
          stroke-dasharray: 359 1 0 0;
        }
      }

      @keyframes otivoSpinDashArray {
        0% {
          stroke-dasharray: 270 90;
        }
        50% {
          stroke-dasharray: 90 270;
        }
        100% {
          stroke-dasharray: 270 90;
        }
      }

      @keyframes otivoDashOffset {
        0% {
          stroke-dashoffset: 360;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }

      @keyframes otivoSpin {
        0% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(180deg);
        }
        50% {
          transform: rotate(360deg);
        }
        75% {
          transform: rotate(540deg);
        }
        100% {
          transform: rotate(720deg);
        }
      }

      /* Forex Details & Caption Styling */
      .otivo-brand-caption {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: #9ca3af;
        opacity: 0.8;
      }

      .otivo-brand-caption .otivo-accent-bull {
        color: #10b981;
        text-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
      }

      .otivo-brand-caption .otivo-accent-bear {
        color: #ef4444;
        text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
      }

      .otivo-ticker-line {
        width: 120px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.5), rgba(239, 68, 68, 0.5), transparent);
      }
    </style>
  </head>
  <body>
    <!-- Instant Native OTIVO Preloader -->
    <div id="otivo-preloader-root">
      <div class="otivo-container">
        <div class="otivo-loader">
          <!-- Gradients Definitions -->
          <svg height="0" width="0" viewBox="0 0 64 64" class="otivo-svg-hidden">
            <defs>
              <!-- O - Metallic Emerald Bullish Gradient -->
              <linearGradient y2="0" x2="1" y1="1" x1="0" id="o-forex-grad">
                <stop stop-color="#10B981" offset="0%"></stop>
                <stop stop-color="#059669" offset="50%"></stop>
                <stop stop-color="#34D399" offset="100%"></stop>
              </linearGradient>
              
              <!-- T - Clean Liquid Cyan Gradient -->
              <linearGradient y2="0" x2="0" y1="1" x1="0" id="t-forex-grad">
                <stop stop-color="#06B6D4" offset="0%"></stop>
                <stop stop-color="#22D3EE" offset="100%"></stop>
              </linearGradient>
              
              <!-- I - Solid Electric Silver Index Gradient -->
              <linearGradient y2="1" x2="0" y1="0" x1="0" id="i-forex-grad">
                <stop stop-color="#F9FAFB" offset="0%"></stop>
                <stop stop-color="#9CA3AF" offset="100%"></stop>
              </linearGradient>
              
              <!-- V - Velocity Bearish Coral Gradient -->
              <linearGradient y2="0" x2="1" y1="1" x1="0" id="v-forex-grad">
                <stop stop-color="#EF4444" offset="0%"></stop>
                <stop stop-color="#F87171" offset="100%"></stop>
              </linearGradient>
              
              <!-- O2 - Dynamic Global Market Flow Gradient -->
              <linearGradient y2="1" x2="1" y1="0" x1="0" id="o2-forex-grad">
                <stop stop-color="#F59E0B" offset="0%"></stop>
                <stop stop-color="#10B981" offset="100%"></stop>
              </linearGradient>
            </defs>
          </svg>

          <!-- O - The Market Compass (Bullish Green Edge) -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="64" width="64" class="otivo-inline-block otivo-pulse-slow" style="--glow-color: rgba(16, 185, 129, 0.4);">
            <circle cx="32" cy="32" r="30" stroke="rgba(16, 185, 129, 0.15)" stroke-width="1" stroke-dasharray="4 4"/>
            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="7" stroke="url(#o-forex-grad)" d="M 32 32
                m 0 -24
                a 24 24 0 1 1 0 48
                a 24 24 0 1 1 0 -48" class="otivo-spin" id="o" pathLength="360"></path>
            <path d="M32 20v5M32 39v5M20 32h5M39 32h5" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2" stroke-linecap="round"/>
          </svg>

          <!-- T - Tech Bar with Trend Ascend Detail -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="64" width="64" class="otivo-inline-block" style="--glow-color: rgba(6, 182, 212, 0.4);">
            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="6.5" stroke="url(#t-forex-grad)" d="M 12,14 h 40 M 32,14 v 36" class="otivo-dash" id="t" pathLength="360"></path>
            <path d="M27 22 l5 -5 l5 5" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>

          <!-- I - Candlestick Index Chart Column -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="64" width="64" class="otivo-inline-block" style="--glow-color: rgba(249, 250, 251, 0.3);">
            <path d="M 32,8 v 48" stroke="rgba(249, 250, 251, 0.3)" stroke-width="2" stroke-linecap="round"/>
            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="9" stroke="url(#i-forex-grad)" d="M 32,18 v 28" class="otivo-dash" id="i" pathLength="360"></path>
          </svg>

          <!-- V - Price Action Velocity Vector (Bearish Corner) -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="64" width="64" class="otivo-inline-block" style="--glow-color: rgba(239, 110, 110, 0.35);">
            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="6.5" stroke="url(#v-forex-grad)" d="M 14,16 l 18,32 l 18,-32" class="otivo-dash" id="v" pathLength="360"></path>
            <circle cx="32" cy="48" r="3" fill="#EF4444"/>
          </svg>

          <!-- O2 - Globular Exchange Ring -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="64" width="64" class="otivo-inline-block otivo-pulse-slow" style="--glow-color: rgba(245, 158, 11, 0.35);">
            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="6.5" stroke="url(#o2-forex-grad)" d="M 32 32
                m 0 -19
                a 19 19 0 1 1 0 38
                a 19 19 0 1 1 0 -38" class="otivo-spin" id="o2" pathLength="360"></path>
            <path d="M26 28a6 6 0 0 1 12-4M38 36a6 6 0 0 1-12 4" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- Forex specific layout details -->
        <div class="otivo-ticker-line"></div>
        <div class="otivo-brand-caption">
          <span class="otivo-accent-bull">▲</span> Forex <span class="otivo-accent-bear">▼</span> Technical Analysis
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
